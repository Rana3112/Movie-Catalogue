services:
  - type: web
    name: movie-catalogue-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: HIANIME_API_BASE_URL
        sync: false
      - key: STREAM_PROXY_SECRET
        generateValue: true
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: ./firebase-service-account.json
